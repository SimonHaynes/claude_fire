[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retireplan"
# Read from `retireplan.__version__`, which is the one that matters: it salts
# the simulation cache key, so a stale copy here would be a second version
# number that silently disagrees with the one governing correctness.
dynamic = ["version"]
description = "Cashflow modelling and Monte Carlo retirement planning, with pluggable withdrawal, drawdown and allocation strategies."
requires-python = ">=3.10"
dependencies = []          # the core engine is deliberately dependency-free

[project.optional-dependencies]
# pymupdf is not for building the report but for proofreading it: rendering
# every page to an image and reading it is the only way the escaping and
# layout defects get caught, and that step is not optional.
report = ["jinja2>=3.1", "weasyprint>=60", "pymupdf>=1.24"]
dev = ["pytest>=8"]

[tool.setuptools.dynamic]
version = {attr = "retireplan.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# `data/mortality/` is a subdirectory on purpose: `MarketData.load` globs
# `data/*.csv` non-recursively and parses a `year` column from every file it
# finds, so a life table sitting beside the return series would break every
# simulation. It therefore needs its own entry here too.
retireplan = [
    "data/*.csv",
    "data/mortality/*.csv",
    "reporting/templates/*.jinja",
    "reporting/assets/fonts/*.woff2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
